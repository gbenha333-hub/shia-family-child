<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف الشريف | شبكة الأسرة والطفل الشيعي</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9f6ed;color:#153d33;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#496057;font-size:13px}header a{color:#075b4d;text-decoration:none}main{max-width:800px;margin:auto}.hidden{display:none!important}#index{padding:12px 15px 30px}#index h1{text-align:center;font-size:24px;margin:16px 0}#search{width:100%;border:1px solid #b9d2c6;border-radius:12px;padding:13px;background:white;margin-bottom:15px}#surahs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.surah{padding:17px 9px;border:1px solid #b8d1c5;background:#fffdf8;color:#145e49;border-radius:11px;text-align:center;font-size:17px}.surah small{display:block;color:#78877c;margin-top:5px;font-size:12px}#status{font-size:13px;color:#667}#reader{background:#faf7ef;min-height:calc(100dvh - 53px);position:relative;padding:20px 16px 85px}.top-meta{display:flex;justify-content:space-between;color:#6c746c;font-size:13px}.surah-banner{display:flex;align-items:center;justify-content:center;gap:8px;border-top:2px solid #16745c;border-bottom:2px solid #16745c;min-height:57px;margin:clamp(30px,9vh,90px) 0 42px;color:#173b30;font-family:serif;font-size:29px;position:relative}.ornament{color:#147458;font-size:29px;flex:1;text-align:center;white-space:nowrap;overflow:hidden}.banner-name{white-space:nowrap}.mushaf{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:clamp(28px,5.5vw,37px);line-height:2.45;text-align:center;color:#101c18;direction:rtl;word-spacing:1px}.ayah{display:inline}.ayah-mark{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #178267;color:#168064;border-radius:50%;width:1.45em;height:1.45em;font:0.43em Tahoma,Arial,sans-serif;vertical-align:middle;margin:0 .14em;white-space:nowrap}.page-foot{text-align:left;color:#72776c;font-size:12px;margin-top:50px}.tools-toggle{position:fixed;bottom:17px;left:16px;z-index:10;background:#075b4d;color:white;border:0;border-radius:50%;width:48px;height:48px;font-size:21px;box-shadow:0 4px 15px #1234}.tools{position:fixed;bottom:75px;left:12px;right:12px;max-width:520px;margin:auto;z-index:9;background:#fffdf8;border:1px solid #d9dfd4;box-shadow:0 7px 35px #1233;border-radius:15px;padding:14px}.tools select,.tools audio{width:100%;margin:5px 0 9px}.tools select{padding:10px;border:1px solid #d5ddd5;border-radius:9px}.tools audio{height:42px}.tools .row{display:flex;gap:8px;align-items:center;margin-top:8px}.tools .row>*{flex:1;min-width:0}.tools button{border:1px solid #c8d8cf;background:#eef4ee;color:#075b4d;border-radius:9px;padding:10px 5px}.tools input{width:100%}.tools label{font-size:13px}.error{padding:18px;color:#9c392e}@media(min-width:700px){#surahs{grid-template-columns:repeat(4,1fr)}#reader{padding:25px 45px 90px}.surah-banner{margin-top:65px}}
</style></head><body><header><a id="back" href="index.html">→ الرئيسية</a><span id="headTitle">القرآن الكريم</span><button id="headerTools" class="hidden" style="background:none;border:0;color:#075b4d;font-size:22px" onclick="toggleTools()">⚙</button></header><main><section id="index"><h1>فهرس سور القرآن الكريم</h1><input id="search" placeholder="ابحث عن سورة..." oninput="filterSurahs()"><div id="status">جار تحميل المصحف...</div><div id="surahs"></div></section><section id="reader" class="hidden"><div class="top-meta"><span id="part"></span><span id="surahTop"></span></div><div class="surah-banner"><span class="ornament">❧ ❀ ❧</span><span id="banner" class="banner-name"></span><span class="ornament">❧ ❀ ❧</span></div><article id="verses" class="mushaf"></article><div id="pageFoot" class="page-foot"></div></section></main><button id="toolsButton" class="tools-toggle hidden" onclick="toggleTools()" aria-label="أدوات القراءة">⚙</button><div id="tools" class="tools hidden"><label>القارئ</label><select id="reciter" onchange="setAudio()"></select><audio id="audio" controls preload="none"></audio><div class="row"><label>حجم الخط<input id="fontSize" type="range" min="24" max="44" value="32" oninput="setFont(this.value)"></label><button onclick="save()">حفظ القراءة</button></div><div class="row"><button onclick="navigate(-1)">→ السورة السابقة</button><button onclick="navigate(1)">السورة التالية ←</button><button onclick="showIndex()">الفهرس</button></div></div><script>
let data=[],current=1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function arabicNum(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}
async function init(){try{let r=await fetch('database.json');if(!r.ok)throw Error('تعذر تحميل قاعدة البيانات');data=await r.json();$('status').textContent=data.length+' سورة';filterSurahs();const n=Number(new URLSearchParams(location.search).get('surah'));if(n>=1&&n<=114)openSurah(n,false);else showIndex(false)}catch(e){$('status').textContent='تعذر تحميل بيانات القرآن: '+e.message}}
function filterSurahs(){let q=$('search').value.trim();$('surahs').innerHTML=data.filter(s=>s.name.ar.includes(q)||String(s.number)===q).map(s=>'<button class="surah" onclick="openSurah('+s.number+')">'+arabicNum(s.number)+'. '+esc(s.name.ar)+'<small>'+arabicNum(s.verses_count)+' آيات</small></button>').join('')}
function showIndex(push=true){$('index').classList.remove('hidden');$('reader').classList.add('hidden');$('tools').classList.add('hidden');$('toolsButton').classList.add('hidden');$('headerTools').classList.add('hidden');$('back').href='index.html';$('back').textContent='→ الرئيسية';$('headTitle').textContent='القرآن الكريم';if(push)history.pushState({},'',location.pathname);window.scrollTo(0,0)}
function openSurah(n,push=true){let s=data.find(x=>x.number===n);if(!s)return;current=n;$('index').classList.add('hidden');$('reader').classList.remove('hidden');$('toolsButton').classList.remove('hidden');$('headerTools').classList.remove('hidden');$('tools').classList.add('hidden');$('back').href='quran.html';$('back').textContent='→ الفهرس';$('headTitle').textContent='المصحف الشريف';$('part').textContent='الجزء '+arabicNum(s.verses[0]?.juz||1);$('surahTop').textContent='سورة '+s.name.ar;$('banner').textContent='سورة '+s.name.ar;$('verses').innerHTML=s.verses.map(v=>'<span class="ayah">'+esc(v.text.ar)+' <span class="ayah-mark">'+arabicNum(v.number)+'</span> </span>').join('');$('pageFoot').textContent='الصفحة '+arabicNum(s.verses[0]?.page||1);window.currentAudio=(s.audio||[]).filter(a=>a.link&&a.link.startsWith('https://'));$('reciter').innerHTML=window.currentAudio.map((a,i)=>'<option value="'+i+'">'+esc(a.reciter.ar)+' — '+esc(a.rewaya?.ar||'')+'</option>').join('');setAudio();const size=Number(localStorage.getItem('quran-font')||32);$('fontSize').value=size;setFont(size);if(push)history.pushState({surah:n},'',location.pathname+'?surah='+n);window.scrollTo(0,0)}
function setAudio(){let a=window.currentAudio?.[Number($('reciter').value)||0];$('audio').pause();$('audio').src=a?.link||'';$('audio').load()}function setFont(n){$('verses').style.fontSize=n+'px';localStorage.setItem('quran-font',n)}function toggleTools(){$('tools').classList.toggle('hidden')}function save(){localStorage.setItem('quran-surah',current);alert('تم حفظ السورة')}function navigate(d){openSurah(Math.max(1,Math.min(114,current+d)))}window.addEventListener('popstate',()=>{const n=Number(new URLSearchParams(location.search).get('surah'));if(n>=1&&n<=114)openSurah(n,false);else showIndex(false)});init();
</script></body></html>
