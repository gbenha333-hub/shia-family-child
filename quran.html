*{box-sizing:border-box}body{margin:0;background:#f9f6ed;color:#153d33;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#496057;font-size:13px}header a{color:#075b4d;text-decoration:none}main{max-width:800px;margin:auto}.hidden{display:none!important}#index{padding:12px 15px 30px}#index h1{text-align:center;font-size:24px;margin:16px 0}#search{width:100%;border:1px solid #b9d2c6;border-radius:12px;padding:13px;background:white;margin-bottom:15px}#surahs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.surah{padding:17px 9px;border:1px solid #b8d1c5;background:#fffdf8;color:#145e49;border-radius:11px;text-align:center;font-size:17px}.surah small{display:block;color:#78877c;margin-top:5px;font-size:12px}#status{font-size:13px;color:#667}#reader{background:#faf7ef;min-height:calc(100dvh - 53px);position:relative;padding:20px 16px 85px}.top-meta{display:flex;justify-content:space-between;color:#6c746c;font-size:13px}.surah-banner{display:flex;align-items:center;justify-content:center;gap:8px;border-top:2px solid #16745c;border-bottom:2px solid #16745c;min-height:57px;margin:clamp(30px,9vh,90px) 0 42px;color:#173b30;font-family:serif;font-size:29px;position:relative}.ornament{color:#147458;font-size:29px;flex:1;text-align:center;white-space:nowrap;overflow:hidden}.banner-name{white-space:nowrap}.mushaf{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:clamp(28px,5.5vw,37px);line-height:2.45;text-align:center;color:#101c18;direction:rtl;word-spacing:1px}.ayah{display:inline}.ayah-mark{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #178267;color:#168064;border-radius:50%;width:1.45em;height:1.45em;font:0.43em Tahoma,Arial,sans-serif;vertical-align:middle;margin:0 .14em;white-space:nowrap}.page-foot{text-align:left;color:#72776c;font-size:12px;margin-to #reader{padding:0 0 88px;background:#faf7ef}#reader .top-meta,#reader .surah-banner,#reader .mushaf,#reader .page-foot{display:none}.mushaf-image{display:block;width:100%;height:auto;max-width:680px;margin:0 auto;object-fit:contain}.page-switch{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:680px;margin:0 auto;padding:8px 13px;background:#faf7ef}.page-switch button{border:0;background:transparent;color:#075b4d;font-size:15px;padding:10px}.page-switch span{font-size:13px;color:#667}.image-error{padding:30px;text-align:center;color:#8d493c}.tools-toggle{bottom:85px}.audio-dock{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;border-top:1px solid #e1e4da;z-index:8;padding:8px 12px;display:flex;align-items:center;gap:9px}.audio-dock select{flex:1;min-width:0;border:0;background:transparent;color:#153d33;font-size:13px;padding:9px}.audio-dock button{border:0;background:#075b4d;color:white;border-radius:50%;width:40px;height:40px;font-size:17px}.audio-dock audio{display:none}.tools{bottom:77px}.tools-toggle{left:12px;bottom:72px;width:42px;height:42px}@media(min-width:700px){#reader{padding:0 0 90px}} /* Sage green Quran theme preview */body{background:#edf3e9;color:#184e40}header{height:74px;background:linear-gradient(130deg,#0d5548,#247a60);color:#fff;border-bottom:3px solid #d5b873;box-shadow:0 2px 12px #1232;padding:0 17px}header a{color:#fff5d9;font-weight:bold}#headTitle{font-family:serif;font-size:23px;color:#f6e4b0}#headerTools{color:#f8e4af!important}#index{background:#edf3e9;min-height:calc(100dvh - 74px)}#index h1{color:#12543f}#search{background:#fffdf7;border:1px solid #9dbfa9}#surahs{gap:11px}.surah{border:1px solid #b9d4bc;background:linear-gradient(#fffef9,#f2f7ed);border-radius:14px;box-shadow:0 2px 8px #1231;color:#126047}.surah:active{background:#dfece0}#reader{background:#e8f0e6;min-height:calc(100dvh - 74px)}.mushaf-image{background:#fffdf6;border:5px solid #e8d7a7;box-shadow:0 4px 16px #183d2c25;max-width:660 und:#f2f4f5}header{height:105px;background:#48a33f;color:white;padding:43px 17px 0;align-items:flex-start;border:0}header a{color:white!important;font-size:15px}#headTitle{color:white!important;font-size:18px}#headerTools{color:white!important}#reader{margin-top:-15px;border-radius:25px 25px 0 0;background:#fff;padding:0 0 165px;overflow:hidden;min-height:calc(100dvh - 90px)}#reader .reader-caption{display:none}.page-switch:first-of-type{border:0;background:white;max-width:680px;padding:9px 12px}.page-switch:first-of-type button{font-size:13px}.mushaf-image{display:block;width:100%;max-width:680px;margin:auto;border:0;border-radius:0;box-shadow:none;background:white}.audio-dock{position:fixed;bottom:0;left:0;right:0;z-index:12;background:white;border:0;border-radius:26px 26px 0 0;box-shadow:0 -5px 20px #00000016;min-height:110px;padding:23px 12px 20px;display:flex;gap:10px}.audio-dock:before{content:'';position:absolute;top:8px;left:calc(50% - 21px);height:5px;width:42px;background:#d8d8d8;border-radius:10px}.audio-dock select{color:#328f3b;font-size:14px;font-weight:bold;text-align:center;flex:1;min-width:0}.audio-dock #playButton{width:57px;height:57px;background:#40a346;color:white;border:0;box-shadow:none;font-size:24px}.audio-dock button:last-child{background:#f4f7f4;color:#3e9943;width:43px;height:43px;border:0;box-shadow:none}.reader-actions{position:relative;background:white;display:flex;justify-content:space-around;padding:8px 4px;max-width:680px;margin:auto}.reader-actions button{border:0;background:none;color:#439e43;font-size:22px;padding:8px}.tools{bottom:117px;background:white;border:0}.page-switch button{color:#419c43}.reader-floating{position:fixed;right:13px;bottom:128px;border:0;background:#fff;color:#419e45;box-shadow:0 2px 12px #0002;border-radius:50%;width:47px;height:47px;font-size:24px;z-index:10}#index{background:#f2f4f5}#surahs .surah{background:#fff;border:1px solid #e3eae3;box-shadow:none}@media(min-width:700px){#reader{padding-bottom:165px}}/* Real flowing Quran text instead of a page screenshot */#reader{background:#f5f6f5;padding-bottom:160px}#reader .mushaf{display:block!important;background:#fff;color:#202320;font-family:'Noto Naskh Arabic','Traditional Arabic',serif;font-size:29px;line-height:2.35;text-align:justify;text-align-last:center;direction:rtl;padding:26px 19px 110px;min-height:calc(100dvh - 190px);border-radius:22px 22px 0 0;max-width:680px;margin:auto;word-spacing:2px}#reader .mushaf-image,#reader .page-switch,#reader .reader-caption{display:none!important}.quran-ayah{display:inline;cursor:pointer;transition:color .2s}.quran-ayah.selected{color:#f07825}.quran-ayah.past{color:#329341}.quran-mark{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;border:1.4px solid currentColor;border-radius:50%;font-family:Tahoma,Arial,sans-serif;font-size:.48em;vertical-align:middle;margin:0 .12em;color:#4a9d51;line-height:1}.quran-ayah.selected .quran-mark{color:#f07825}.quran-surah-title{font-family:'Traditional Arabic',serif;font-size:30px;text-align:center;color:#399a43;padding:14px 6px 5px}.quran-basmala{font-family:'Traditional Arabic',serif;font-size:32px;text-align:center;color:#328d3c;margin-bottom:15px}.reader-actions{position:sticky;bottom:112px;z-index:5;background:#fff}.audio-dock{z-index:12}#reader .top-meta{display:flex!important;background:white;max-width:680px;margin:auto;padding:8px 17px;color:#3e8e47}#reader .surah-banner{display:none!important}#reader .page-foot{display:none!important}@media(max-width:500px){#reader .mushaf{font-size:27px;padding:20px 17px 130px;line-height:2.3}}/* Quranic calligraphy and full vowel marks */#reader .mushaf{font-family:'Amiri Quran','Amiri','Traditional Arabic',serif!important;font-size:30px!important;font-weight:400!important;line-height:2.55!important;letter-spacing:0!important;word-spacing:0!important;font-variant-ligatures:normal;font-feature-settings:"liga" 1,"rlig" 1,"calt" 1;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}#reader .quran-ayah{font-family:inherit;font-weight:400;unicode-bidi:normal}#reader .quran-mark{font-family:'Amiri Quran','Traditional Arabic',serif;font-size:.55em;border:0;min-width:1.5em;height:1.5em;color:#398d48}#reader .quran-surah-title,#reader .quran-basmala{font-family:'Amiri Quran','Traditional Arabic',serif!important;font-weight:400}@media(max-width:500px){#reader .mushaf{font-size:29px!important;line-height:2.55!important}}</style></head><body><header><a id="back" href="index.html">→ الرئيسية</a><span id="headTitle">القرآن الكريم</span><button id="headerTools" class="hidden" style="background:none;border:0;color:#075b4d;font-size:22px" onclick="toggleTools()">⚙</button></header><main><section id="index"><h1>فهرس سور القرآن الكريم</h1><input id="search" placeholder="ابحث عن سورة..." oninput="filterSurahs()"><div id="status">جار تحميل المصحف...</div><div id="surahs"></div></section><section id="reader" class="hidden"><div class="top-meta"><span id="part"></span><span id="surahTop"></span></div><div class="surah-banner"><span class="ornament">❧ ❀ ❧</span><span id="banner" class="banner-name"></span><span class="ornament">❧ ❀ ❧</span></div><div id="readerCaption" class="reader-caption"></div><div class="page-switch"><button onclick="changePage(-1)">→ السابقة</button><span id="pageNumber"></span><button onclick="changePage(1)">التالية ←</button></div><article id="flowingQuran" class="mushaf"></article><img id="mushafImage" class="mushaf-image" alt="صفحة من مصحف المدينة" loading="eager"><div id="imageError" class="image-error hidden">تعذر تحميل صورة الصفحة. تأكد من اتصال الإنترنت.</div><div class="page-switch"><button onclick="changePage(-1)">→ السابقة</button><span id="pageNumberBottom"></span><button onclick="changePage(1)">التالية ←</button></div><div id="pageFoot" class="page-foot"></div><div class="reader-actions"><button onclick="showIndex()">☷</button><button onclick="save()">♧</button><button onclick="changePage(-1)">◀</button><button onclick="changePage(1)">▶</button><button onclick="toggleTools()">⚙</button></div></section></main><button id="readerFloating" class="reader-floating hidden" onclick="showIndex()" aria-label="الفهرس">◎</button><div id="audioDock" class="audio-dock hidden"><button id="playButton" onclick="playPause()" aria-label="تشغيل التلاوة">▶</button><select id="dockReciter" onchange="syncReciter(this.value)" aria-label="اختيار القارئ"></select><audio id="dockAudio" preload="none"></audio><button onclick="toggleTools()" aria-label="إعدادات">⚙</button></div><button id="toolsButton" class="tools-toggle hidden" onclick="toggleTools()" aria-label="أدوات القراءة">⚙</button><div id="tools" class="tools hidden"><label>القارئ</label><select id="reciter" onchange="setAudio()"></select><audio id="audio" controls preload="none"></audio><div class="row"><label>حجم الخط<input id="fontSize" type="range" min="24" max="44" value="32" oninput="setFont(this.value)"></label><button onclick="save()">حفظ القراءة</button></div><div class="row"><button onclick="navigate(-1)">→ السورة السابقة</button><button onclick="navigate(1)">السورة التالية ←</button><button onclick="showIndex()">الفهرس</button></div></div><script>
let data=[],current=1,currentPage=1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function arabicNum(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}
async function init(){try{let r=await fetch('database.json');if(!r.ok)throw Error('تعذر تحميل قاعدة البيانات');data=await r.json();$('status').textContent=data.length+' سورة';filterSurahs();const n=Number(new URLSearchParams(location.search).get('surah'));if(n>=1&&n<=114)openSurah(n,false);else if(Number(new URLSearchParams(location.search).get('page'))>=1)openPage(Number(new URLSearchParams(location.search).get('page')),false);else showIndex(false)}catch(e){$('status').textContent='تعذر تحميل بيانات القرآن: '+e.message}}
function filterSurahs(){let q=$('search').value.trim();$('surahs').innerHTML=data.filter(s=>s.name.ar.includes(q)||String(s.number)===q).map(s=>'<button class="surah" onclick="openSurah('+s.number+')">'+arabicNum(s.number)+'. '+esc(s.name.ar)+'<small>'+arabicNum(s.verses_count)+' آيات</small></button>').join('')}
function showIndex(push=true){$('index').classList.remove('hidden');$('reader').classList.add('hidden');$('tools').classList.add('hidden');$('toolsButton').classList.add('hidden');$('audioDock').classList.add('hidden');$('readerFloating').classList.add('hidden');$('headerTools').classList.add('hidden');$('back').href='index.html';$('back').textContent='→ الرئيسية';$('headTitle').textContent='القرآن الكريم';if(push)history.pushState({},'',location.pathname);window.scrollTo(0,0)}
function openSurah(n,push=true){let s=data.find(x=>x.number===n);if(!s)return;current=n;openPage(Number(s.verses[0]?.page||1),push)}
function openPage(p,push=true){currentPage=Math.max(1,Math.min(604,p));let match=data.find(s=>s.verses.some(v=>Number(v.page)===currentPage));if(match)current=match.number;let s=data.find(x=>x.number===current)||data[0];$('index').classList.add('hidden');$('reader').classList.remove('hidden');$('audioDock').classList.remove('hidden');$('readerFloating').classList.remove('hidden');$('toolsButton').classList.add('hidden');$('headerTools').classList.remove('hidden');$('tools').classList.add('hidden');$('back').href='quran.html';$('back').textContent='→ الفهرس';$('headTitle').textContent='مصحف المدينة';$('pageNumber').textContent='صفحة '+arabicNum(currentPage)+' من ٦٠٤';$('pageNumberBottom').textContent='صفحة '+arabicNum(currentPage);$('part').textContent='الجزء '+arabicNum(s.verses.find(v=>Number(v.page)===currentPage)?.juz||1);$('surahTop').textContent='سورة '+s.name.ar;$('readerCaption').textContent='سورة '+s.name.ar+' · صفحة '+arabicNum(currentPage);$('headTitle').textContent='سورة '+s.name.ar;const pageVerses=s.verses;const first=pageVerses[0];$('flowingQuran').innerHTML='<div class="quran-surah-title">سورة '+esc(s.name.ar)+'</div>'+((current!==1&&current!==9)?'<div class="quran-basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'')+pageVerses.map((v,i)=>'<span class="quran-ayah'+(i===0?' selected':'')+'" data-ayah="'+i+'" onclick="selectAyah('+i+')">'+esc(v.text.ar)+' <span class="quran-mark">'+arabicNum(v.number)+'</span> </span>').join('');window.selectedAyah=0;const img=$('mushafImage');$('imageError').classList.add('hidden');img.style.display='block';img.onerror=()=>{img.style.display='none';$('imageError').classList.remove('hidden')};img.removeAttribute('src');window.currentAudio=(s.audio||[]).filter(a=>a.link&&a.link.startsWith('https://'));let opts=window.currentAudio.map((a,i)=>'<option value="'+i+'">'+esc(a.reciter.ar)+' — '+esc(a.rewaya?.ar||'')+'</option>').join('');$('reciter').innerHTML=opts;$('dockReciter').innerHTML=opts;setAudio();if(push)history.pushState({page:currentPage},'',location.pathname+'?page='+currentPage);window.scrollTo(0,0)}
function changePage(d){openPage(currentPage+d)}function selectAyah(i){window.selectedAyah=i;document.querySelectorAll('.quran-ayah').forEach((el,n)=>{el.classList.toggle('selected',n===i);el.classList.toggle('past',n<i)})}
function syncReciter(v){$('reciter').value=v;$('dockReciter').value=v;setAudio()}
function playPause(){let a=$('dockAudio');if(a.paused){a.play().then(()=>$('playButton').textContent='❚❚').catch(()=>$('playButton').textContent='▶')}else{a.pause();$('playButton').textContent='▶'}}
function setAudio(){let a=window.currentAudio?.[Number($('reciter').value)||0];$('dockReciter').value=$('reciter').value;$('audio').pause();$('dockAudio').pause();$('audio').src=a?.link||'';$('dockAudio').src=a?.link||'';$('playButton').textContent='▶'}function setFont(n){$('verses').style.fontSize=n+'px';localStorage.setItem('quran-font',n)}function toggleTools(){$('tools').classList.toggle('hidden')}function save(){localStorage.setItem('quran-surah',current);alert('تم حفظ السورة')}function navigate(d){openSurah(Math.max(1,Math.min(114,current+d)))}window.addEventListener('popstate',()=>{const n=Number(new URLSearchParams(location.search).get('surah'));if(n>=1&&n<=114)openSurah(n,false);else if(Number(new URLSearchParams(location.search).get('page'))>=1)openPage(Number(new URLSearchParams(location.search).get('page')),false);else showIndex(false)});if('serviceWorker' in navigator){navigator.serviceWorker.register('./quran-sw.js').catch(()=>{});}init();
</script></body></html>
