<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القرآن الكريم | شبكة الأسرة والطفل الشيعي</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#153f34;font-family:Tahoma,Arial,sans-serif}header{background:#075b4d;color:#fff;padding:18px;position:sticky;top:0;z-index:2}header a{color:#f0d48f;text-decoration:none}main{max-width:850px;margin:auto;padding:16px}.panel{background:#fff;border-radius:18px;padding:17px;margin-bottom:15px;box-shadow:0 2px 12px #1232}input,select,button{font:inherit;padding:12px;border:1px solid #ddd;border-radius:10px}input{width:100%;margin:8px 0}button{background:#075b4d;color:white;cursor:pointer}button.alt{background:#f3efe4;color:#075b4d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}#surahs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:55vh;overflow:auto}.surah{background:#f6f8f5;color:#164639;text-align:right;border:1px solid #dde8df}.verse{font-family:'Traditional Arabic','Amiri',serif;font-size:29px;line-height:2.3;padding:13px 3px;border-bottom:1px solid #eee;color:#173e34}.num{font:14px Tahoma;color:#a17e3c}.verse small{display:block;font:13px Tahoma;color:#78837a;line-height:1.6}.hidden{display:none}audio{width:100%;margin-top:12px}h1,h2{text-align:center}#status{font-size:13px;color:#667} @media(min-width:700px){#surahs{grid-template-columns:repeat(4,1fr)}} #reader{padding:12px}#reader h1{font-size:25px;margin:5px}#meta{font-size:13px;color:#778;margin:5px 0 12px}.reader-tools{position:sticky;top:65px;z-index:4;background:white;border:1px solid #e4e7e1;border-radius:15px;padding:10px;box-shadow:0 3px 15px #1232}.reader-tools .row{flex-wrap:nowrap}.reader-tools button{font-size:13px;padding:10px 5px}.reader-tools select{width:100%;margin-top:8px;background:#f8f7f2}.reader-tools audio{margin-top:5px;height:40px}.verse{font-size:27px;line-height:2.1;padding:17px 5px}.verse small{font-size:11px}.bottom-nav{position:sticky;bottom:0;background:white;z-index:5;display:flex;gap:8px;padding:9px;border-top:1px solid #ddd}.bottom-nav button{flex:1}#surahs{max-height:220px}#surahPanel.collapsed #surahs,#surahPanel.collapsed #search,#surahPanel.collapsed #status{display:none}#surahPanel h2{font-size:18px;cursor:pointer}@media(max-width:500px){main{padding:9px}.panel{padding:12px}.verse{font-size:26px}}</style></head><body><header><a href="index.html">← الرئيسية</a><strong style="display:block;text-align:center">القرآن الكريم</strong></header><main><div class="panel collapsed" id="surahPanel"><h2 onclick="document.getElementById('surahPanel').classList.toggle('collapsed')">فهرس السور ▾</h2><input id="search" placeholder="ابحث عن سورة أو آية..." oninput="filter()"><div id="status">جار تحميل بيانات القرآن...</div><div id="surahs"></div></div><div class="panel hidden" id="reader"><h1 id="title"></h1><p id="meta" style="text-align:center"></p><div class="reader-tools"><div class="row"><button onclick="prev()" class="alt">→ السابقة</button><button onclick="next()" class="alt">التالية ←</button></div><div class="row" style="margin-top:7px"><label style="font-size:13px">حجم الخط <input id="fontSize" type="range" min="22" max="38" value="27" oninput="setFontSize(this.value)"></label><button class="alt" onclick="save()">حفظ القراءة</button></div><select id="reciter" onchange="setAudio()"></select><audio id="audio" controls preload="none"></audio></div><div id="verses"></div><div class="bottom-nav"><button class="alt" onclick="prev()">→ السورة السابقة</button><button class="alt" onclick="next()">السورة التالية ←</button></div></div></main><script>let data=[],current=1;const $=x=>document.getElementById(x);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){try{let r=await fetch('database.json');if(!r.ok)throw Error('تعذر قراءة الملف');data=await r.json();$('status').textContent=data.length+' سورة';filter();let n=Number(localStorage.getItem('quran-surah')||1);openSurah(n,false)}catch(e){$('status').textContent='تعذر تحميل البيانات. افتح الملفات عبر خادم محلي أو موقع منشور، وليس مباشرة بصيغة file://';}}function filter(){let q=$('search').value.trim();let results=data.filter(s=>s.name.ar.includes(q)||String(s.number)===q||(q.length>2&&s.verses.some(v=>v.text.ar.includes(q))));$('surahs').innerHTML=results.map(s=>`<button class="surah" onclick="openSurah(${s.number})">${s.number}. ${escapeHtml(s.name.ar)}<br><small>${s.verses_count} آيات</small></button>`).join('')}function openSurah(n,scroll=true){let s=data.find(x=>x.number===n);if(!s)return;current=n;$('reader').classList.remove('hidden');$('title').textContent='سورة '+s.name.ar;$('meta').textContent=s.revelation_place.ar+' • '+s.verses_count+' آيات';$('verses').innerHTML=s.verses.map(v=>`<div class="verse" id="v${v.number}">${escapeHtml(v.text.ar)} <span class="num">۞ ${v.number}</span><small>الجزء ${v.juz} · الصفحة ${v.page}</small></div>`).join('');$('reciter').innerHTML=s.audio.filter(a=>a.link&&a.link.startsWith('https://')).map((a,i)=>`<option value="${i}">${escapeHtml(a.reciter.ar)} — ${escapeHtml(a.rewaya?.ar||'')}</option>`).join('');window.currentAudio=s.audio.filter(a=>a.link&&a.link.startsWith('https://'));setAudio();setFontSize(Number(localStorage.getItem('quran-font')||27));$('fontSize').value=localStorage.getItem('quran-font')||27;$('surahPanel').classList.add('collapsed');if(scroll)$('reader').scrollIntoView({behavior:'smooth'})}function setAudio(){let a=window.currentAudio?.[Number($('reciter').value)||0];$('audio').pause();$('audio').src=a?.link||'';$('audio').load()}function setFontSize(n){document.querySelectorAll('.verse').forEach(x=>x.style.fontSize=n+'px');localStorage.setItem('quran-font',n)}function save(){localStorage.setItem('quran-surah',current);alert('تم حفظ السورة على هذا الجهاز')}function prev(){openSurah(Math.max(1,current-1))}function next(){openSurah(Math.min(114,current+1))}init();</script></body></html>
