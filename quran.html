<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف الشريف | شبكة الأسرة والطفل الشيعي</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9f6ed;color:#153d33;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#496057;font-size:13px}header a{color:#075b4d;text-decoration:none}main{max-width:800px;margin:auto}.hidden{display:none!important}#index{padding:12px 15px 30px}#index h1{text-align:center;font-size:24px;margin:16px 0}#search{width:100%;border:1px solid #b9d2c6;border-radius:12px;padding:13px;background:white;margin-bottom:15px}#surahs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.surah{padding:17px 9px;border:1px solid #b8d1c5;background:#fffdf8;color:#145e49;border-radius:11px;text-align:center;font-size:17px}.surah small{display:block;color:#78877c;margin-top:5px;font-size:12px}#status{font-size:13px;color:#667}#reader{background:#faf7ef;min-height:calc(100dvh - 53px);position:relative;padding:20px 16px 85px}.top-meta{display:flex;justify-content:space-between;color:#6c746c;font-size:13px}.surah-banner{display:flex;align-items:center;justify-content:center;gap:8px;border-top:2px solid #16745c;border-bottom:2px solid #16745c;min-height:57px;margin:clamp(30px,9vh,90px) 0 42px;color:#173b30;font-family:serif;font-size:29px;position:relative}.ornament{color:#147458;font-size:29px;flex:1;text-align:center;white-space:nowrap;overflow:hidden}.banner-name{white-space:nowrap}.mushaf{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:clamp(28px,5.5vw,37px);line-height:2.45;text-align:center;color:#101c18;direction:rtl;word-spacing:1px}.ayah{display:inline}.ayah-mark{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #178267;color:#168064;border-radius:50%;width:1.45em;height:1.45em;font:0.43em Tahoma,Arial,sans-serif;vertical-align:middle;margin:0 .14em;white-space:nowrap}.page-foot{text-align:left;color:#72776c;font-size:12px;margin-top:50px}.tools-toggle{position:fixed;bottom:17px;left:16px;z-index:10;background:#075b4d;color:white;border:0;border-radius:50%;width:48px;height:48px;font-size:21px;box-shadow:0 4px 15px #1234}.tools{position:fixed;bottom:75px;left:12px;right:12px;max-width:520px;margin:auto;z-index:9;background:#fffdf8;border:1px solid #d9dfd4;box-shadow:0 7px 35px #1233;border-radius:15px;padding:14px}.tools select,.tools audio{width:100%;margin:5px 0 9px}.tools select{padding:10px;border:1px solid #d5ddd5;border-radius:9px}.tools audio{height:42px}.tools .row{display:flex;gap:8px;align-items:center;margin-top:8px}.tools .row>*{flex:1;min-width:0}.tools button{border:1px solid #c8d8cf;background:#eef4ee;color:#075b4d;border-radius:9px;padding:10px 5px}.tools input{width:100%}.tools label{font-size:13px}.error{padding:18px;color:#9c392e}@media(min-width:700px){#surahs{grid-template-columns:repeat(4,1fr)}#reader{padding:25px 45px 90px}.surah-banner{margin-top:65px}}
#reader{padding:0 0 88px;background:#faf7ef}#reader .top-meta,#reader .surah-banner,#reader .mushaf,#reader .page-foot{display:none}.mushaf-image{display:block;width:100%;height:auto;max-width:680px;margin:0 auto;object-fit:contain}.page-switch{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:680px;margin:0 auto;padding:8px 13px;background:#faf7ef}.page-switch button{border:0;background:transparent;color:#075b4d;font-size:15px;padding:10px}.page-switch span{font-size:13px;color:#667}.image-error{padding:30px;text-align:center;color:#8d493c}.tools-toggle{bottom:85px}.audio-dock{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;border-top:1px solid #e1e4da;z-index:8;padding:8px 12px;display:flex;align-items:center;gap:9px}.audio-dock select{flex:1;min-width:0;border:0;background:transparent;color:#153d33;font-size:13px;padding:9px}.audio-dock button{border:0;background:#075b4d;color:white;border-radius:50%;width:40px;height:40px;font-size:17px}.audio-dock audio{display:none}.tools{bottom:77px}.tools-toggle{left:12px;bottom:72px;width:42px;height:42px}@media(min-width:700px){#reader{padding:0 0 90px}} </style></head><body><header><a id="back" href="index.html">→ الرئيسية</a><span id="headTitle">القرآن الكريم</span><button id="headerTools" class="hidden" style="background:none;border:0;color:#075b4d;font-size:22px" onclick="toggleTools()">⚙</button></header><main><section id="index"><h1>فهرس سور القرآن الكريم</h1><input id="search" placeholder="ابحث عن سورة..." oninput="filterSurahs()"><div id="status">جار تحميل المصحف...</div><div id="surahs"></div></section><section id="reader" class="hidden"><div class="top-meta"><span id="part"></span><span id="surahTop"></span></div><div class="surah-banner"><span class="ornament">❧ ❀ ❧</span><span id="banner" class="banner-name"></span><span class="ornament">❧ ❀ ❧</span></div><div class="page-switch"><button onclick="changePage(-1)">→ الصفحة السابقة</button><span id="pageNumber"></span><button onclick="changePage(1)">الصفحة التالية ←</button></div><img id="mushafImage" class="mushaf-image" alt="صفحة من مصحف المدينة" loading="eager"><div id="imageError" class="image-error hidden">تعذر تحميل صورة الصفحة. تأكد من اتصال الإنترنت.</div><div class="page-switch"><button onclick="changePage(-1)">→ السابقة</button><span id="pageNumberBottom"></span><button onclick="changePage(1)">التالية ←</button></div><div id="pageFoot" class="page-foot"></div></section></main><div id="audioDock" class="audio-dock hidden"><button id="playButton" onclick="playPause()" aria-label="تشغيل التلاوة">▶</button><select id="dockReciter" onchange="syncReciter(this.value)" aria-label="اختيار القارئ"></select><audio id="dockAudio" preload="none"></audio><button onclick="toggleTools()" aria-label="إعدادات">⚙</button></div><button id="toolsButton" class="tools-toggle hidden" onclick="toggleTools()" aria-label="أدوات القراءة">⚙</button><div id="tools" class="tools hidden"><label>القارئ</label><select id="reciter" onchange="setAudio()"></select><audio id="audio" controls preload="none"></audio><div class="row"><label>حجم الخط<input id="fontSize" type="range" min="24" max="44" value="32" oninput="setFont(this.value)"></label><button onclick="save()">حفظ القراءة</button></div><div class="row"><button onclick="navigate(-1)">→ السورة السابقة</button><button onclick="navigate(1)">السورة التالية ←</button><button onclick="showIndex()">الفهرس</button></div></div><script>
let data=[],current=1,currentPage=1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function arabicNum(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}
async function init(){try{let r=await fetch('database.json');if(!r.ok)throw Error('تعذر تحميل قاعدة البيانات');data=await r.json();$('status').textContent=data.length+' سورة';filterSurahs();const n=Number(new URLSearchParams(location.search).get('surah'));if(n>=1&&n<=114)openSurah(n,false);else if(Number(new URLSearchParams(location.search).get('page'))>=1)openPage(Number(new URLSearchParams(location.search).get('page')),false);else showIndex(false)}catch(e){$('status').textContent='تعذر تحميل بيانات القرآن: '+e.message}}
function filterSurahs(){let q=$('search').value.trim();$('surahs').innerHTML=data.filter(s=>s.name.ar.includes(q)||String(s.number)===q).map(s=>'<button class="surah" onclick="openSurah('+s.number+')">'+arabicNum(s.number)+'. '+esc(s.name.ar)+'<small>'+arabicNum(s.verses_count)+' آيات</small></button>').join('')}
function showIndex(push=true){$('index').classList.remove('hidden');$('reader').classList.add('hidden');$('tools').classList.add('hidden');$('toolsButton').classList.add('hidden');$('audioDock').classList.add('hidden');$('headerTools').classList.add('hidden');$('back').href='index.html';$('back').textContent='→ الرئيسية';$('headTitle').textContent='القرآن الكريم';if(push)history.pushState({},'',location.pathname);window.scrollTo(0,0)}
function openSurah(n,push=true){let s=data.find(x=>x.number===n);if(!s)return;current=n;openPage(Number(s.verses[0]?.page||1),push)}
function openPage(p,push=true){currentPage=Math.max(1,Math.min(604,p));let match=data.find(s=>s.verses.some(v=>Number(v.page)===currentPage));if(match)current=match.number;let s=data.find(x=>x.number===current)||data[0];$('index').classList.add('hidden');$('reader').classList.remove('hidden');$('audioDock').classList.remove('hidden');$('toolsButton').classList.add('hidden');$('headerTools').classList.remove('hidden');$('tools').classList.add('hidden');$('back').href='quran.html';$('back').textContent='→ الفهرس';$('headTitle').textContent='مصحف المدينة';$('pageNumber').textContent='صفحة '+arabicNum(currentPage)+' من ٦٠٤';$('pageNumberBottom').textContent='صفحة '+arabicNum(currentPage);$('part').textContent='الجزء '+arabicNum(s.verses.find(v=>Number(v.page)===currentPage)?.juz||1);$('surahTop').textContent='سورة '+s.name.ar;const img=$('mushafImage');$('imageError').classList.add('hidden');img.style.display='block';img.onerror=()=>{img.style.display='none';$('imageError').classList.remove('hidden')};img.src='https://raw.githubusercontent.com/akram-seid/quran-hd-images/main/images/'+String(currentPage).padStart(3,'0')+'.jpg';window.currentAudio=(s.audio||[]).filter(a=>a.link&&a.link.startsWith('https://'));let opts=window.currentAudio.map((a,i)=>'<option value="'+i+'">'+esc(a.reciter.ar)+' — '+esc(a.rewaya?.ar||'')+'</option>').join('');$('reciter').innerHTML=opts;$('dockReciter').innerHTML=opts;setAudio();if(push)history.pushState({page:currentPage},'',location.pathname+'?page='+currentPage);window.scrollTo(0,0)}
function changePage(d){openPage(currentPage+d)}
function syncReciter(v){$('reciter').value=v;$('dockReciter').value=v;setAudio()}
function playPause(){let a=$('dockAudio');if(a.paused){a.play().then(()=>$('playButton').textContent='❚❚').catch(()=>$('playButton').textContent='▶')}else{a.pause();$('playButton').textContent='▶'}}
function setAudio(){let a=window.currentAudio?.[Number($('reciter').value)||0];$('dockReciter').value=$('reciter').value;$('audio').pause();$('dockAudio').pause();$('audio').src=a?.link||'';$('dockAudio').src=a?.link||'';$('playButton').textContent='▶'}function setFont(n){$('verses').style.fontSize=n+'px';localStorage.setItem('quran-font',n)}function toggleTools(){$('tools').classList.toggle('hidden')}function save(){localStorage.setItem('quran-surah',current);alert('تم حفظ السورة')}function navigate(d){openSurah(Math.max(1,Math.min(114,current+d)))}window.addEventListener('popstate',()=>{const n=Number(new URLSearchParams(location.search).get('surah'));if(n>=1&&n<=114)openSurah(n,false);else if(Number(new URLSearchParams(location.search).get('page'))>=1)openPage(Number(new URLSearchParams(location.search).get('page')),false);else showIndex(false)});init();
</script></body></html>
